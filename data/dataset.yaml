# Ultralytics YOLO dataset config for a custom household-object model.
# Paths are relative to `path`. See data/README.md for the expected layout.
path: ../data/processed
train: images/train
val: images/val
test: images/test  # optional

# Start with classes COCO lacks, plus the COCO household classes you care about.
# Class IDs must match the label files. Extend this list as the dataset grows.
names:
  0: chair
  1: couch
  2: bed
  3: dining table
  4: tv
  5: refrigerator
  6: microwave
  7: oven
  8: sink
  9: toilet
  10: laptop
  11: remote
  12: cup
  13: bottle
  14: book
  15: clock
  16: potted plant
  17: ceiling fan
  18: washing machine
  19: pressure cooker
  20: water bottle
  21: mixer grinder
  22: air conditioner
  23: wardrobe
  24: pillow
  25: bucket
