# Ultralytics YOLO dataset config for the specialized household model - V1 (15 classes).
# Reduced scope for faster data collection, training and CPU inference.
# The full 43-class list is kept in data_v2.yaml for later.
# Plan and class decisions: docs/household-model-plan.md
#
# No `path:` key on purpose: Ultralytics then resolves train/val relative to
# this file's folder, so training works from any working directory.

train: images/train
val: images/val

nc: 15
names:
  0: bed
  1: sofa
  2: chair
  3: table
  4: tv
  5: laptop
  6: refrigerator
  7: microwave
  8: washing machine
  9: ceiling fan
  10: cupboard
  11: gas stove
  12: pressure cooker
  13: bottle
  14: person
